services:
  messer-swipe:
    # This fork's image, published by GitHub Actions on a v*-swipeboxd.N tag.
    # Pin a version instead of latest for reproducible updates.
    image: ghcr.io/giraycoskun/swipeboxd:latest
    container_name: messer-swipe
    restart: unless-stopped
    environment:
      # WHAT TO SERVE. Two common shapes for this fork:
      #
      # 1. Your Jellyfin/Emby/Plex library:
      #    PROVIDER=jellyfin PROVIDER_LOCK=true JELLYFIN_URL=http://your-jellyfin:8096
      #
      # 2. Letterboxd: either one fixed public watchlist...
      #    PROVIDER=letterboxd PROVIDER_LOCK=true
      #    LETTERBOXD_WATCHLIST_URL=https://letterboxd.com/giraycoskun/watchlist/
      #    ...or let each visitor pick a source and enter a username at sign-in:
      - PROVIDER=jellyfin
      - PROVIDER_LOCK=false
      # No provider credentials are needed when visitors choose Letterboxd watchlists.

      # The public URL the app is served from; drives secure cookies, OG image, robots.txt
      - APP_PUBLIC_URL=https://swipe.example.com
      # Set true behind HTTPS
      - USE_SECURE_COOKIES=true

      # OPTIONAL: A long random string (at least 32 chars) for session encryption.
      # Generated automatically and stored beside the database if not provided.
      # - AUTH_SECRET=your_random_secret_here

      # OPTIONAL: Database location (internal to container, OR an external database URL + DATABASE_AUTH_TOKEN)
      # Default: file:/app/data/swiparr.db
      - DATABASE_URL=file:/app/data/swiparr.db

      # OPTIONAL: Custom base path (e.g. /swipe). Must be set at BUILD TIME via
      # --build-arg URL_BASE_PATH=/swipe and baked into the image; the published
      # images serve at the root path.
      # - URL_BASE_PATH=

      # OPTIONAL: The hostname the server binds to
      # Default: 0.0.0.0 (listens on all interfaces)
      - HOSTNAME=0.0.0.0
    volumes:
      # Persist database and other data
      - ./messer-swipe-data:/app/data
    ports:
      - 4321:4321
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4321${URL_BASE_PATH:-}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
