# Dependabot Configuration for Swiparr
# Note: GitLab-specific keys (check-branch-convention, security-updates) removed.
# GitHub handles security updates via repo-level alerts, not YAML config.
version: 2
updates:
  # Maintain dependencies for npm (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "America/New_York"
    # REDUCED from 5 to 3 to prevent PR flood
    open-pull-requests-limit: 3
    # ADDITIONAL ignored dependencies for stability
    ignore:
      - "eslint"                # Stable, well-maintained
      - "typescript"            # Stable major version
      - "webpack"               # Stable major version
      - "react"                 # Framework core, test before updating
      - "react-dom"             # Framework core, test before updating
      # `next` is deliberately NOT ignored wholesale: it carries security patches
      # inside a major (16.1.6 -> 16.4.6 closed two criticals) and the ignore list
      # was why the shipped image sat on a vulnerable version. Majors still wait
      # for a human.
      - dependency-name: "next"
        versions: [">=17"]
      - "drizzle-kit"           # Database tool, careful updates
    target-branch: "develop"
    versioning-strategy: increase
    allow:
      - dependency-type: "direct"
    commit-message:
      include: "scope"
      
  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    target-branch: "develop"
    versioning-strategy: increase
    allow:
      - dependency-type: "all"
    commit-message:
      include: "scope"
