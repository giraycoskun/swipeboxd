name: Publish Swipeboxd Image

on:
  push:
    tags: ['v*-swipeboxd.*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: giraycoskun/swipeboxd

jobs:
  # Build natively and push by digest; neither build moves the version tag.
  build:
    name: Build image (${{ matrix.platform }})
    if: github.repository == 'giraycoskun/swipeboxd' && !github.event.deleted
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check version tag
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+-swipeboxd\.[0-9]+$ || ${#GITHUB_REF_NAME} -gt 128 ]]; then
            echo 'Use a version tag such as v2.6.0-swipeboxd.1.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          build-args: APP_VERSION=${{ github.ref_name }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Publish the version tag only after both platform builds succeed.
  merge:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          sources=()
          for digest in *; do
            sources+=("$image@sha256:$digest")
          done
          docker buildx imagetools create --tag "$image:$GITHUB_REF_NAME" --tag "$image:latest" "${sources[@]}"

  # Pull the freshly published tag onto the VPS and restart. Runs only when the
  # deployment variables exist (repo Variables → DEPLOY_HOST/DEPLOY_USER/DEPLOY_PORT),
  # so the same workflow stays usable before a server exists.
  deploy:
    name: Deploy to the VPS
    needs: merge
    runs-on: ubuntu-latest
    if: vars.DEPLOY_HOST != ''
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Pull and restart over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          SSH_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          SSH_HOST: ${{ vars.DEPLOY_HOST }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # accept-new pins the host key after the first contact; swap in a
          # DEPLOY_HOST_KEY secret pinned to the known_hosts line for stricter trust.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              "set -eu
               cd /opt/swipeboxd
               docker compose pull
               docker compose up -d --remove-orphans
               docker image prune -f
               echo 'deployed'" 2>&1 | sed 's/^/  /'
      - name: Verify the new version answers
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          SSH_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          SSH_HOST: ${{ vars.DEPLOY_HOST }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for i in $(seq 1 60); do
            VERSION=$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              "curl -fs http://localhost:4321/api/version" 2>/dev/null | sed -n 's/.*"version":"\([^"]*\)".*/\1/p') || true
            if [ "$VERSION" = "${IMAGE_TAG#v}" ]; then
              echo "the VPS now answers version $VERSION"; exit 0
            fi
            sleep 2
          done
          echo "the server did not report $IMAGE_TAG within 2 minutes"; exit 1
