name: tests

# One workflow for the repo's own gates. Named `tests` with a `unit` job on purpose: that is the
# required check branch protection and the Dependabot auto-merge already wait for.
on:
  push:
    branches: [master, develop, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # The gate that unit tests cannot be: the fixture-driven UI contract on a real
  # server. It needs no provider — the media API is answered from fixtures — so it
  # catches "the deck renders nothing" and "the switch lost its paper knob" on every
  # push instead of on a user's phone.
  e2e:
    runs-on: ubuntu-latest
    env:
      PROVIDER: tmdb
      AUTH_SECRET: "ci-only-secret-ci-only-secret-00000000"
      APP_PUBLIC_URL: "http://127.0.0.1:3100"
      USE_SECURE_COOKIES: "false"
      DATABASE_URL: "file:./ci.db"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # playwright is a harness dependency, not an app one: install it into the job
      # rather than the lockfile, so `npm ci` stays the only install the app needs.
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start the app
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3100/api/health >/dev/null; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "the app never answered /api/health"; exit 1
      - run: node e2e/contract.mjs
        env:
          E2E_BASE_URL: "http://127.0.0.1:3100"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shots
          path: e2e/shots
          retention-days: 7
          if-no-files-found: ignore
